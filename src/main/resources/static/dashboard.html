<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Inventory — Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">

  <!-- SIDEBAR -->
  <nav class="sidebar" id="sidebar">

    <div class="sidebar-brand">
      <div class="brand-icon"><i class="bi bi-box-seam-fill"></i></div>
      <div class="brand-text">
        <h6>SmartInventory</h6>
        <small>Instrument Management</small>
      </div>
    </div>

    <ul class="sidebar-nav">
      <li class="nav-section-label">Overview</li>
      <li><a class="nav-link active" data-page="dashboard" href="#">
        <i class="bi bi-grid-1x2-fill"></i> <span>Dashboard</span>
      </a></li>
      <li><a class="nav-link" data-page="inventory" href="#">
        <i class="bi bi-clipboard-data-fill"></i> <span>Inventory</span>
      </a></li>

      <li class="nav-section-label">Products</li>
      <li><a class="nav-link" data-page="products" href="#">
        <i class="bi bi-tags-fill"></i> <span>Products</span>
      </a></li>
      <li><a class="nav-link" data-page="serials" href="#">
        <i class="bi bi-upc-scan"></i> <span>Serial Numbers</span>
      </a></li>

      <li class="nav-section-label">Transactions</li>
      <li><a class="nav-link" data-page="stock-in" href="#">
        <i class="bi bi-box-arrow-in-down"></i> <span>Stock In</span>
      </a></li>
      <li><a class="nav-link" data-page="stock-out" href="#">
        <i class="bi bi-box-arrow-up"></i> <span>Stock Out</span>
      </a></li>
      <li><a class="nav-link" data-page="history" href="#">
        <i class="bi bi-clock-history"></i> <span>History</span>
      </a></li>

      <li class="nav-section-label">Tools</li>
      <li data-admin-only><a class="nav-link" data-page="db-viewer" href="#">
        <i class="bi bi-database-fill"></i> <span>DB Viewer</span>
      </a></li>
    </ul>

    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="user-avatar" id="user-avatar">A</div>
        <div class="user-info">
          <div class="uname" id="sidebar-username">admin</div>
          <div class="urole" id="sidebar-role">ADMIN</div>
        </div>
        <button class="btn-logout" id="btn-logout" title="Logout">
          <i class="bi bi-box-arrow-right"></i>
        </button>
      </div>
    </div>
  </nav>

  <!-- MAIN -->
  <div class="main-content">
    <div class="top-bar">
      <div class="top-bar-left">
        <button id="menu-toggle"><i class="bi bi-list"></i></button>
        <div>
          <div class="page-title" id="page-title">Dashboard</div>
          <div class="page-subtitle" id="page-subtitle">Overview</div>
        </div>
      </div>
      <div id="top-actions"></div>
    </div>
    <div class="page-body" id="page-body"></div>
  </div>

</div>

<!-- Toast container -->
<div style="position:fixed;top:14px;right:14px;z-index:9999;display:flex;flex-direction:column;gap:8px;" id="toast-container"></div>

<!-- Mobile overlay -->
<div id="sidebar-overlay" onclick="closeSidebar()"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="pages/dashboard.js"></script>
<script src="pages/products.js"></script>
<script src="pages/stockin.js"></script>
<script src="pages/stockout.js"></script>
<script src="pages/serials.js"></script>
<script src="pages/inventory.js"></script>
<script src="pages/history.js"></script>
<script src="pages/dbviewer.js"></script>
<script src="js/app.js"></script>

</body>
</html>
