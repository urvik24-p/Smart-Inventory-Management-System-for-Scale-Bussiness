spring.application.name=smartinventory
server.port=${PORT:8080}
server.error.include-message=never
server.forward-headers-strategy=framework

# All credentials and secrets must be injected by the deployment environment.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}

# Schema auto-creation: Hibernate creates/updates tables automatically if they don't exist yet
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Disable Flyway so deployment doesn't crash on empty/fresh databases or metadata locks
spring.flyway.enabled=false

app.jwt.secret=${JWT_SECRET:60AphINIokev-kgf1NIIr3p6Y81oAhUp9UuJi1V1cb8L7tE9rtI-x4MrXNwKh4X5}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.security.allowed-origins=${ALLOWED_ORIGINS:*}
app.bootstrap-admin.username=${APP_BOOTSTRAP_ADMIN_USERNAME:admin}
app.bootstrap-admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:Admin@12345678}

