spring.application.name=smartinventory
server.port=${PORT:8080}
server.error.include-message=never
server.forward-headers-strategy=framework

# All credentials and secrets must be injected by the deployment environment.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}

# Schema is managed exclusively by Flyway migrations.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
# baseline-version=0 means: on a fresh DB, baseline is recorded at V0 (virtual),
# so V1 runs normally and creates all tables.
# On a pre-Flyway DB that already has tables, flyway_schema_history already exists
# from a prior run, so this setting is ignored.
spring.flyway.baseline-version=0

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
app.security.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000}
