spring.application.name=smartinventory
# ============================================
# MySQL Database Configuration
# ============================================

spring.datasource.url=jdbc:mysql://localhost:3306/inventory
spring.datasource.username=root
spring.datasource.password=urvik2407

# ============================================
# JPA Configuration
# ============================================

# Check that our Java entities match the existing database.
# Do NOT create or modify our tables automatically.
spring.jpa.hibernate.ddl-auto=validate

# Show SQL queries in the console while developing
spring.jpa.show-sql=true

# MySQL database dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ============================================
# Server Configuration
# ============================================

server.port=8081

# ============================================
# JWT Configuration
# ============================================

# Base64-encoded secret key (32 bytes minimum for HS256)
