spring.application.name=smartinventory

# ============================================
# MySQL / TiDB Database Configuration
# ============================================
# Connects to TiDB Cloud if env variables are set, or uses defaults
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://gateway01.ap-northeast-1.prod.aws.tidbcloud.com:4000/test?useSSL=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:FeF29SwUW2zBrEE.root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:urvik2407}

# ============================================
# JPA / Hibernate Auto Table Creation
# ============================================
